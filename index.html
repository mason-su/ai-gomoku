<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gomoku — Five in a Row</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="game" aria-labelledby="game-title">
        <header class="header">
          <h1 id="game-title">Gomoku</h1>
          <p class="subtitle">Five in a Row · Freestyle rules</p>
        </header>

        <div class="controls-row">
          <div class="mode-bar" role="group" aria-label="Game mode">
            <label class="mode-label" for="mode-select">Mode</label>
            <select id="mode-select" class="mode-select">
              <option value="pvp">Player vs Player</option>
              <option value="easy">vs AI — Easy</option>
              <option value="medium" selected>vs AI — Medium</option>
              <option value="hard">vs AI — Hard</option>
              <option value="aivsai">AI vs AI (Spectate)</option>
            </select>
          </div>

          <div id="side-bar" class="mode-bar" role="group" aria-label="Your side">
            <label class="mode-label" for="side-select">You play</label>
            <select id="side-select" class="mode-select">
              <option value="black" selected>Black (first)</option>
              <option value="white">White (second)</option>
            </select>
          </div>
        </div>

        <div
          id="spectator-bar"
          class="spectator-bar"
          hidden
          aria-label="AI vs AI spectator controls"
        >
          <div class="mode-bar">
            <label class="mode-label" for="black-ai-select">Black AI</label>
            <select id="black-ai-select" class="mode-select mode-select-sm">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
          <div class="mode-bar">
            <label class="mode-label" for="white-ai-select">White AI</label>
            <select id="white-ai-select" class="mode-select mode-select-sm">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard" selected>Hard</option>
            </select>
          </div>
          <div class="mode-bar">
            <label class="mode-label" for="speed-select">Speed</label>
            <select id="speed-select" class="mode-select mode-select-sm">
              <option value="1200">Slow</option>
              <option value="650" selected>Normal</option>
              <option value="250">Fast</option>
              <option value="80">Very fast</option>
            </select>
          </div>
          <div class="spectator-actions">
            <button type="button" id="spec-start-btn" class="btn btn-primary btn-compact">
              Start
            </button>
            <button type="button" id="spec-pause-btn" class="btn btn-secondary btn-compact" disabled>
              Pause
            </button>
            <button type="button" id="spec-resume-btn" class="btn btn-secondary btn-compact" disabled>
              Resume
            </button>
            <button type="button" id="spec-restart-btn" class="btn btn-secondary btn-compact">
              Restart
            </button>
          </div>
        </div>

        <div class="scoreboard" aria-label="Scoreboard">
          <div class="score-card score-black">
            <span class="score-label">Black</span>
            <span id="score-black" class="score-value">0</span>
          </div>
          <div class="score-card score-draw">
            <span class="score-label">Draws</span>
            <span id="score-draws" class="score-value">0</span>
          </div>
          <div class="score-card score-white">
            <span class="score-label">White</span>
            <span id="score-white" class="score-value">0</span>
          </div>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">
          Black's turn
        </p>

        <div class="board-shell">
          <div
            id="board"
            class="board"
            role="grid"
            aria-label="Gomoku board, 15 by 15"
          ></div>
        </div>

        <div class="actions">
          <button type="button" id="restart-btn" class="btn btn-primary">
            Restart Game
          </button>
          <button type="button" id="reset-scores-btn" class="btn btn-secondary">
            Reset Scores
          </button>
        </div>

        <p id="play-hint" class="hint">
          Stones are placed on intersections. Choose Black to move first, or
          White to let the AI open.
        </p>
      </section>
    </main>

    <script src="./js/game.js"></script>
    <script src="./js/ai.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
